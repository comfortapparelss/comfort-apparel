*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0a0a0a;color:#fff;line-height:1.6}
nav{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:rgba(10,10,10,0.9);backdrop-filter:blur(12px);z-index:20}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}
nav a{color:#999;text-decoration:none;margin-left:22px;font-size:13px;font-weight:600;letter-spacing:1px}
nav a:hover{color:#fff}
.hero{padding:90px 5% 60px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center;max-width:1300px;margin:0 auto}
.hero-text h1{font-size:64px;font-weight:900;line-height:0.9;letter-spacing:-3px;margin-bottom:20px}
.hero-text p{color:#888;font-size:16px;max-width:450px;margin-bottom:30px}
.btn{background:#fff;color:#000;padding:14px 32px;border-radius:100px;text-decoration:none;font-weight:800;display:inline-block;transition:.2s}
.btn:hover{transform:scale(1.05)}
.hero-img{border-radius:32px;overflow:hidden;border:1px solid #222}
.hero-img img{width:100%;display:block}
.badge-row{display:flex;gap:12px;margin:40px 5%;padding:20px;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;justify-content:center;flex-wrap:wrap;color:#666;font-size:12px;letter-spacing:1px}
.grid{padding:40px 5% 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;max-width:1300px;margin:0 auto}
.card{background:#141414;border-radius:24px;overflow:hidden;border:1px solid #222;transition:.3s}
.card:hover{transform:translateY(-8px);border-color:#333}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff}
.card-body{padding:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .desc{color:#666;font-size:12px;margin-bottom:8px}
.price{margin-top:8px}
.price b{color:#fff;font-size:20px}
.price s{color:#555;margin-left:8px;font-size:14px}
.tag{display:inline-block;background:#222;color:#fff;font-size:10px;padding:4px 10px;border-radius:100px;margin-bottom:10px;letter-spacing:1px}
.section{padding:60px 5%;max-width:1300px;margin:0 auto;border-top:1px solid #1a1a1a}
.section h2{font-size:28px;margin-bottom:20px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
